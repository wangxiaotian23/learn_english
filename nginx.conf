server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript application/json;

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.json$ {
        expires 1d;
        add_header Cache-Control "public";
    }
}
